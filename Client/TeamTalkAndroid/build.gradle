plugins {
    alias(libs.plugins.android.application)
}

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    enableKotlin = false
    namespace = 'dk.bearware.gui'
    compileSdk = 37 
    buildToolsVersion = '37.0.0'
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'dk.bearware.gui'
        minSdk = 23
        targetSdk = 37
        versionCode = 150
        versionName = '5.22'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        // PERBAIKAN 1: Buang bahasa yang tidak perlu
        resConfigs "in", "en"

        // PERBAIKAN 2: Batasi arsitektur native hanya untuk HP fisik
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // PERBAIKAN UTAMA: Blok signingConfigs diletakkan langsung di dalam android
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile = rootProject.file(ks['storeFile'])
                storePassword = ks['storePassword']
                keyAlias = ks['keyAlias']
                keyPassword = ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // PERBAIKAN 3: Optimalisasi ukuran APK lewat R8
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            if (ksFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            if (ksFile.exists() && ks['signDebug']?.toBoolean()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    // PERBAIKAN 4: Pemisahan APK per arsitektur (Ramping)
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk = false 
        }
    }

    sourceSets {
        main {
            // PERBAIKAN SINTAKS: Menggunakan jalur string statis untuk menghindari circular dependency
            jniLibs.srcDirs = ["${project.buildDir}/jniLibs-staging"]
        }
    }

    // PERBAIKAN 5: Pembersihan Debug Symbols
    packaging {
        jniLibs {
            excludes.add('**/libTeamTalk5Pro-jni.so')
            keepDebugSymbols.clear() 
        }
        pickFirsts = [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md'
        ]
    }

    lint {
        disable 'MissingTranslation'
    }
}

tasks.register('syncJniLibs', Sync) {
    from('../../Library/TeamTalkJNI/libs') {
        include 'arm64-v8a/**', 'armeabi-v7a/**'
    }
    into layout.buildDirectory.dir('jniLibs-staging')
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncJniLibs' }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.gson
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.media
    implementation libs.androidx.preference
    implementation libs.androidx.viewpager
    implementation libs.material
    implementation files('../../Library/TeamTalkJNI/libs/TeamTalk5.jar')

    testImplementation libs.junit.jupiter.api
    testImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')

    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.junit.jupiter.api
    androidTestImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')
}

