plugins {
    alias(libs.plugins.android.application)
}

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    enableKotlin = false
    namespace = 'dk.bearware.gui'
    compileSdk = 37 // Perbaikan sintaks: versi diisi langsung angka untuk AGP modern
    buildToolsVersion = '37.0.0'
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'dk.bearware.gui'
        minSdk = 23
        targetSdk = 37
        versionCode = 150
        versionName = '5.22'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        // PERBAIKAN 1: Buang bahasa yang tidak perlu dari library pihak ketiga.
        // Hanya simpan aset teks bahasa Indonesia ("in") dan Inggris ("en").
        resConfigs "in", "en"

        // PERBAIKAN 2: Batasi kompilasi kode native (C++) hanya untuk HP Android Fisik.
        // Menghapus arsitektur Intel x86 & x86_64 membuat ukuran APK berkurang sangat banyak!
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    if (ksFile.exists()) {
        signingConfigs {
            release {
                storeFile = rootProject.file(ks['storeFile'])
                storePassword = ks['storePassword']
                keyAlias = ks['keyAlias']
                keyPassword = ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // PERBAIKAN 3: Aktifkan pengecilan kode (R8) & penghapusan aset sampah.
            // Di kode lama Anda nilainya 'false', ini alasan utama APK membengkak.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            if (ksFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            if (ks['signDebug']?.toBoolean()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    // PERBAIKAN 4: Matikan pembuatan satu APK universal raksasa.
    // Kode ini akan memerintahkan Gradle untuk menghasilkan 2 file APK terpisah yang ringan.
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a' // Hanya kompilasi untuk arsitektur HP Android
            universalApk = false // DIUBAH KE FALSE agar tidak menggabungkan file arsitektur
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [layout.buildDirectory.dir('jniLibs-staging')]
        }
    }

    // PERBAIKAN 5: Bersihkan log pelacakan internal (Debug Symbols) dari file .so native
    packaging {
        jniLibs {
            excludes += ['**/libTeamTalk5Pro-jni.so']
            // Memaksa sistem untuk menghapus teks debugging dari TeamTalkJNI agar filenya ramping
            keepDebugSymbols.clear() 
        }
        pickFirsts = [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md'
        ]
    }

    lint {
        disable 'MissingTranslation'
    }
}

tasks.register('syncJniLibs', Sync) {
    from('../../Library/TeamTalkJNI/libs') {
        include 'arm64-v8a/**', 'armeabi-v7a/**' // Menghemat waktu CI: hanya sinkronkan folder ARM Android
    }
    into layout.buildDirectory.dir('jniLibs-staging')
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncJniLibs' }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.gson
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.media
    implementation libs.androidx.preference
    implementation libs.androidx.viewpager
    implementation libs.material
    implementation files('../../Library/TeamTalkJNI/libs/TeamTalk5.jar')

    testImplementation libs.junit.jupiter.api
    testImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')

    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.junit.jupiter.api
    androidTestImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')
}
