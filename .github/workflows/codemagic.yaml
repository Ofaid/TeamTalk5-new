workflows:
  teamtalk-android:
    name: TeamTalk5 Android Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - keystore_reference          # ← Replace with your uploaded keystore reference
      groups:
        - google_play                 # ← Optional: for Google Play publishing
      vars:
        PACKAGE_NAME: "dk.bearware.gui"   # ← TeamTalk5's actual package name
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android release
        script: |
          ./gradlew bundleRelease     # Creates .aab (use assembleRelease for .apk)
    artifacts:
      - app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - your_email@example.com
        notify:
          success: true
          failure: false