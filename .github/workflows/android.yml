name: TeamTalk5 Android Build (Manual - Universal)

on:
  workflow_dispatch:  # MANUAL ONLY! Gak auto-run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-universal-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      
      - name: Cache Native Builds (WebRTC & Install)
        uses: actions/cache@v4
        with:
          path: |
            ${{runner.workspace}}/webrtc
            ${{runner.workspace}}/install-android
          key: ${{ runner.os }}-native-${{ hashFiles('**/CMakeLists.txt', '**/Makefile') }}
          restore-keys: ${{ runner.os }}-native-
      
      - name: Install Dependencies
        working-directory: ${{github.workspace}}/Build
        run: sudo make depend-ubuntu24-android
      
      - name: Build TeamTalk Library (C++)
        working-directory: ${{github.workspace}}/Build
        run: |
          make CMAKE_EXTRA="-G Ninja -DWEBRTC_FETCH_PATH=${{runner.workspace}}/webrtc -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-android" \
               CMAKE_BUILD_EXTRA="--target install" android-all
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      
      - name: Generate Release Keystore
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          keytool -genkeypair -v -keystore release-key.keystore \
            -alias teamtalk-release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=TeamTalk, OU=Dev, O=TeamTalk, L=Jakarta, ST=DKI, C=ID"
          cat > keystore.properties <<EOF
          storeFile=release-key.keystore
          storePassword=android123
          keyAlias=teamtalk-release
          keyPassword=android123
          EOF
      
      - name: Build Universal Release APK
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          chmod +x gradlew
          # FLAG PENTING: -PuniversalApk=true bikin 1 APK buat semua arsitektur
          ./gradlew assembleRelease --no-daemon -PuniversalApk=true
      
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: TeamTalk5-Universal-Release-APK
          path: Client/TeamTalkAndroid/build/outputs/apk/release/*.apk